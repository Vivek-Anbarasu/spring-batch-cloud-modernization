{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "spring-batch-cloud-modernization.fullname" . }}
  labels:
    {{- include "spring-batch-cloud-modernization.labels" . | nindent 4 }}
  annotations:
    {{- include "spring-batch-cloud-modernization.annotations" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "spring-batch-cloud-modernization.selectorLabels" . | nindent 6 }}
{{- end }}