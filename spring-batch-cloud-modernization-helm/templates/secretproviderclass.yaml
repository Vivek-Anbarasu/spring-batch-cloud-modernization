{{- if .Values.secretsStore.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretsStore.secretProviderClassName }}
  labels:
    {{- include "spring-batch-cloud-modernization.labels" . | nindent 4 }}
  annotations:
    {{- include "spring-batch-cloud-modernization.annotations" . | nindent 4 }}
spec:
  provider: {{ .Values.secretsStore.provider }}
  parameters:
    {{- if eq .Values.secretsStore.provider "azure" }}
    clientID: "${AZURE_CLIENT_ID}"
    keyvaultName: "${KEYVAULT_NAME}"
    cloudName: "AzurePublicCloud"
    tenantID: "${AZURE_TENANT_ID}"
    # One Key Vault object per entry in .data. Using .secretName here - the Kubernetes Secret
    # name - would ask the provider for an object that does not exist in the vault.
    objects: |
      array:
        {{- range .Values.secretsStore.secretObjects }}
        {{- range .data }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
          objectVersion: ""
        {{- end }}
        {{- end }}
    {{- else if eq .Values.secretsStore.provider "aws" }}
    region: "${AWS_REGION}"
    objects: |
      {{- range .Values.secretsStore.secretObjects }}
      {{- range .data }}
      - objectName: "{{ .objectName }}"
        objectType: "secretsmanager"
      {{- end }}
      {{- end }}
    {{- else if eq .Values.secretsStore.provider "gcp" }}
    projectID: "${GCP_PROJECT_ID}"
    secrets: |
      {{- range .Values.secretsStore.secretObjects }}
      {{- range .data }}
      - resourceName: "{{ .objectName }}"
        fileName: "{{ .key }}"
      {{- end }}
      {{- end }}
    {{- else if eq .Values.secretsStore.provider "vault" }}
    vaultAddress: "${VAULT_ADDR}"
    vaultRole: "${VAULT_ROLE}"
    objects: |
      {{- range .Values.secretsStore.secretObjects }}
      {{- range .data }}
      - objectName: "{{ .objectName }}"
        objectType: "secret"
      {{- end }}
      {{- end }}
    {{- end }}
  {{- with .Values.secretsStore.secretObjects }}
  # Kubernetes Secrets materialised from the mounted objects, so the application can consume
  # them through the normal env/secretKeyRef path.
  secretObjects:
    {{- range . }}
    - secretName: {{ .secretName }}
      type: {{ .type }}
      data:
        {{- range .data }}
        - objectName: {{ .objectName }}
          key: {{ .key }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
