{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spring-batch-cloud-modernization.serviceAccountName" . }}
  labels:
    {{- include "spring-batch-cloud-modernization.labels" . | nindent 4 }}
  annotations:
    {{- include "spring-batch-cloud-modernization.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}