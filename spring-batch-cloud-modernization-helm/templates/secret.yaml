{{- if and (not .Values.secretsStore.enabled) .Values.datasource.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spring-batch-cloud-modernization.datasourceSecretName" . }}
  labels:
    {{- include "spring-batch-cloud-modernization.labels" . | nindent 4 }}
  annotations:
    {{- include "spring-batch-cloud-modernization.annotations" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.datasource.username | quote }}
  password: {{ .Values.datasource.password | quote }}
{{- end }}